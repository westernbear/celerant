plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url = "https://jitpack.io"
		content { includeGroup "com.github.westernbear" }
	}
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
	maven {
		url = "https://maven.caffeinemc.net/releases"
		content { includeGroup "net.caffeinemc" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"celerant" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi.configureTests {
	createSourceSet = true
	modId = "celerant-gametest"
	enableGameTests = false
	enableClientGameTests = true
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("com.github.westernbear:MCglTF-1.20.4:${project.mcgltf_version}") {
		transitive = false
	}
	compileOnly "maven.modrinth:iris:${project.iris_version}"
	runtimeOnly "maven.modrinth:iris:${project.iris_version}"
	runtimeOnly "net.caffeinemc:sodium-fabric:${project.sodium_version}"
	compileOnly "io.github.douira:glsl-transformer:3.0.0-pre3"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

def clientCheckClasspath = sourceSets.client.output + sourceSets.main.output + sourceSets.client.compileClasspath

tasks.register("vrmSelfCheck", JavaExec) {
	group = "verification"
	dependsOn tasks.named("compileClientJava")
	classpath = clientCheckClasspath
	mainClass = "io.github.westernbear.celerant.client.VrmRuntime"
	enableAssertions = true
}

tasks.register("toonSelfCheck", JavaExec) {
	group = "verification"
	dependsOn tasks.named("compileClientJava")
	classpath = clientCheckClasspath
	mainClass = "io.github.westernbear.celerant.client.iris.IrisToonPatcher"
	enableAssertions = true
}

tasks.named("check") {
	dependsOn tasks.named("vrmSelfCheck"), tasks.named("toonSelfCheck")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
