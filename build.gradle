plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17' apply false
	id 'net.neoforged.moddev' version '2.0.141' apply false
}

tasks.register('buildAll') {
	group = 'build'
	description = 'Build all Celerant modules'
	dependsOn ':api:build', ':common:check', ':fabric:build', ':neoforge:build'
}

tasks.register('runFabricClientGameTest') {
	group = 'verification'
	description = 'Run Fabric client GameTest'
	dependsOn ':fabric:runClientGameTest'
}

tasks.register('runNeoForgeClientGameTest') {
	group = 'verification'
	description = 'Run NeoForge client GameTest smoke harness'
	dependsOn ':neoforge:runClientGameTest'
}
