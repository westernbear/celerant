name: CI

on:
  push:
    branches: [main, feat/multiloader-fabric-neoforge]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  common-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch MCglTF multiloader JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-mcgltf.sh
      - name: Common unit tests
        run: |
          args=(--no-daemon --stacktrace :common:test :api:build)
          [[ -n "${LOCAL_MCGLTF_API:-}" ]] && args+=(-PlocalMcgltfApi="$LOCAL_MCGLTF_API")
          [[ -n "${LOCAL_MCGLTF_COMMON:-}" ]] && args+=(-PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON")
          ./gradlew "${args[@]}"

  fabric-build-gametest:
    needs: common-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch MCglTF multiloader JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-mcgltf.sh fabric
      - name: Build Fabric
        run: |
          ./gradlew :fabric:build --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfFabric="$LOCAL_MCGLTF_FABRIC"
      - name: Run Fabric client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric:runClientGameTest --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfFabric="$LOCAL_MCGLTF_FABRIC"
      - name: Upload Fabric artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: celerant-fabric-${{ github.sha }}
          path: |
            fabric/build/libs/*.jar
            fabric/build/runs/clientGameTest/screenshots/celerant-oneconfig-*-os.png
          if-no-files-found: warn

  neoforge-build-gametest:
    needs: common-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch MCglTF multiloader JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-mcgltf.sh neoforge
      - name: Build NeoForge
        run: |
          ./gradlew :neoforge:build --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfNeoForge="$LOCAL_MCGLTF_NEOFORGE" \
            -PirisRuntime=true
      - name: Run NeoForge client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :neoforge:runClientGameTest --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfNeoForge="$LOCAL_MCGLTF_NEOFORGE" \
            -PirisRuntime=true
      - name: Upload NeoForge artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: celerant-neoforge-${{ github.sha }}
          path: neoforge/build/libs/*.jar
          if-no-files-found: warn

  upload-api:
    needs: [fabric-build-gametest, neoforge-build-gametest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build API
        run: ./gradlew :api:build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: celerant-api-${{ github.sha }}
          path: api/build/libs/*.jar
          if-no-files-found: error
