name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qxF "version=$version" gradle.properties
          echo "version=$version" >> "$GITHUB_OUTPUT"

  fabric:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch MCglTF Fabric JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-mcgltf.sh fabric
      - name: Build Fabric
        run: |
          ./gradlew :fabric:build --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfFabric="$LOCAL_MCGLTF_FABRIC"
      - name: Run Fabric client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric:runClientGameTest --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfFabric="$LOCAL_MCGLTF_FABRIC"
      - name: Stage Fabric release JAR
        shell: bash
        run: |
          mkdir -p release/fabric
          find fabric/build/libs -maxdepth 1 -type f -name 'Celerant-Fabric-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
            -exec cp -t release/fabric {} +
          test -n "$(find release/fabric -maxdepth 1 -type f -name '*.jar' | head -n1)"
      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v7
        with:
          name: celerant-fabric-${{ needs.version.outputs.version }}
          path: release/fabric/*.jar
          if-no-files-found: error

  neoforge:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch MCglTF NeoForge JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-mcgltf.sh neoforge
      - name: Build NeoForge
        run: |
          ./gradlew :neoforge:build --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfNeoForge="$LOCAL_MCGLTF_NEOFORGE" \
            -PirisRuntime=true
      - name: Run NeoForge client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :neoforge:runClientGameTest --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfNeoForge="$LOCAL_MCGLTF_NEOFORGE" \
            -PirisRuntime=true
      - name: Stage NeoForge release JAR
        shell: bash
        run: |
          mkdir -p release/neoforge
          find neoforge/build/libs -maxdepth 1 -type f -name 'Celerant-NeoForge-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
            -exec cp -t release/neoforge {} +
          test -n "$(find release/neoforge -maxdepth 1 -type f -name '*.jar' | head -n1)"
      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v7
        with:
          name: celerant-neoforge-${{ needs.version.outputs.version }}
          path: release/neoforge/*.jar
          if-no-files-found: error

  api:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch MCglTF API JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-mcgltf.sh
      - name: Build API
        run: |
          args=(--no-daemon --stacktrace :api:build)
          [[ -n "${LOCAL_MCGLTF_API:-}" ]] && args+=(-PlocalMcgltfApi="$LOCAL_MCGLTF_API")
          [[ -n "${LOCAL_MCGLTF_COMMON:-}" ]] && args+=(-PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON")
          ./gradlew "${args[@]}"
      - name: Stage API release JAR
        shell: bash
        run: |
          mkdir -p release/api
          find api/build/libs -maxdepth 1 -type f -name 'celerant-api-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
            -exec cp -t release/api {} +
          test -n "$(find release/api -maxdepth 1 -type f -name '*.jar' | head -n1)"
      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: celerant-api-${{ needs.version.outputs.version }}
          path: release/api/*.jar
          if-no-files-found: error

  publish:
    needs: [version, fabric, neoforge, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download Fabric artifact
        uses: actions/download-artifact@v7
        with:
          name: celerant-fabric-${{ needs.version.outputs.version }}
          path: release/fabric
      - name: Download NeoForge artifact
        uses: actions/download-artifact@v7
        with:
          name: celerant-neoforge-${{ needs.version.outputs.version }}
          path: release/neoforge
      - name: Download API artifact
        uses: actions/download-artifact@v7
        with:
          name: celerant-api-${{ needs.version.outputs.version }}
          path: release/api
      - name: Assemble release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p release/dist
          cp release/fabric/*.jar release/neoforge/*.jar release/api/*.jar release/dist/
          (cd release/dist && sha256sum *.jar > SHA256SUMS.txt)
          echo "Release assets for v$VERSION:"
          ls -la release/dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          args=(
            "$GITHUB_REF_NAME"
            release/dist/*.jar
            release/dist/SHA256SUMS.txt
            --verify-tag
            --generate-notes
            --title "Celerant $VERSION"
          )
          [[ "$VERSION" == *-*alpha* || "$VERSION" == *-*beta* || "$VERSION" == *-*rc* ]] && args+=(--prerelease)
          gh release create "${args[@]}"
