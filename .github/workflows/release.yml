name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qxF "version=$version" gradle.properties
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch MCglTF multiloader JARs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash .github/scripts/fetch-mcgltf.sh

      - name: Build and run Fabric client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew clean buildAll :fabric:runClientGameTest --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfFabric="$LOCAL_MCGLTF_FABRIC"

      - name: Run NeoForge client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :neoforge:runClientGameTest --no-daemon --stacktrace \
            -PlocalMcgltfApi="$LOCAL_MCGLTF_API" \
            -PlocalMcgltfCommon="$LOCAL_MCGLTF_COMMON" \
            -PlocalMcgltfNeoForge="$LOCAL_MCGLTF_NEOFORGE" \
            -PirisRuntime=true

      - name: Create checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p release
          cp fabric/build/libs/Celerant-Fabric-*.jar release/
          cp neoforge/build/libs/Celerant-NeoForge-*.jar release/
          cp api/build/libs/celerant-api-*.jar release/
          (cd release && sha256sum *.jar > SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          args=(
            "$GITHUB_REF_NAME"
            release/*.jar
            release/SHA256SUMS.txt
            --verify-tag
            --generate-notes
            --title "Celerant $VERSION"
          )
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          gh release create "${args[@]}"
